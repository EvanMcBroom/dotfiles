## General settings
set-option -g default-terminal "screen-256color"
set-option -g history-limit 100000 # Increase scrollback history
set-option -g mode-keys vi
set-option -g prefix C-a # Set Ctrl-a to be the command prefix
set-option -g repeat-time 50

## Base Indexes
set -g base-index 1
setw -g pane-base-index 1

## Keybindings
bind a send-prefix # The command prefix then 'a' will send a normal Ctrl-a
bind r source-file ~/.tmux.conf \; display "Reloaded .tmux.conf!"
bind - split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'
bind j select-pane -U
bind k select-pane -D
bind h select-pane -L
bind l select-pane -R
bind J resize-pane -U 5
bind K resize-pane -D 5
bind H resize-pane -L 5
bind L resize-pane -R 5
bind ^ resize-pane -U 5
bind v resize-pane -D 5
bind < resize-pane -L 5
bind > resize-pane -R 5

## Status bar
set -g status-justify centre
set -g status-left-length 50
# Hostname
set -g status-left " @#h "
set -g status-right-length 70
# Battery charge and current date and time
set -g status-right "#(battery=''; if [ -d /sys/class/power_supply ]; then battery=$(find /sys/class/power_supply/BAT* -type f -name capacity 2>/dev/null | head -n 1 | xargs cat 2>/dev/null | sed 's/^/charge /; s/$/%/'); elif command -v pmset >/dev/null 2>&1; then battery=$(pmset -g batt | awk -F'; *' 'NR==2 { for (i=1; i<=NF; i++) if ($i ~ /%/) { print \"charge \" $i; exit } }'); elif command -v apm >/dev/null 2>&1; then battery=$(apm -l 2>/dev/null | sed 's/^/charge /; s/$/%/'); elif sysctl -n hw.acpi.battery.life >/dev/null 2>&1; then battery=$(sysctl -n hw.acpi.battery.life 2>/dev/null | sed 's/^/charge /; s/$/%/'); fi; [ -n \"$battery\" ] && printf '%s :: ' \"$battery\")%Y-%m-%d %I:%M "

# Visual notifications
setw -g monitor-activity on
set -g visual-activity on
